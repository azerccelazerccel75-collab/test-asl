<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aslan Lessons - Tədris Mərkəzi İdarəetmə Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FAFAFA; color: #1F2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F1F1F1; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 bg-slate-50">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <div id="app" class="flex-grow flex flex-col w-full"></div>

    <!-- Общие модальные окна (Скрыты по умолчанию) -->
    
    <!-- История студента -->
    <div id="modal-student-history" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <div><h3 id="hist-student-name" class="font-bold text-lg"></h3><p id="hist-student-sub" class="text-xs text-slate-500"></p></div>
                <button class="btn-close-modal text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">Dərs İştirakı</h4>
                    <div id="hist-attendance-list" class="max-h-40 overflow-y-auto space-y-1 p-2 bg-slate-50 rounded-xl text-xs border"></div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-slate-700 uppercase mb-2">Ödəniş Tarixçəsi</h4>
                    <div id="hist-cycles-list" class="max-h-40 overflow-y-auto space-y-1 p-2 bg-slate-50 rounded-xl text-xs border"></div>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button class="btn-close-modal px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold">Bağla</button>
            </div>
        </div>
    </div>

    <!-- Редактирование студента -->
    <div id="modal-edit-student" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-in">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-base"><i class="fa-solid fa-pen-to-square text-orange-500 mr-2"></i>Şagird Redaktəsi</h3>
                <button class="btn-close-modal text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-edit-student" class="space-y-3 text-xs">
                <input type="hidden" id="edit-st-id">
                <div><label class="block font-semibold mb-1">Ad və Soyad</label><input type="text" id="edit-st-name" required class="w-full p-2 border rounded-xl"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block font-semibold mb-1">Tədris Tipi</label><select id="edit-st-type" class="w-full p-2 border rounded-xl"><option value="individual">Fərdi</option><option value="group">Qrup</option><option value="unassigned">Bölüşdürülməyib</option></select></div>
                    <div><label class="block font-semibold mb-1">Paket Norması</label><select id="edit-st-pkg" class="w-full p-2 border rounded-xl"><option value="8">8 dərs</option><option value="12">12 dərs</option></select></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block font-semibold mb-1">Müəllim</label><select id="edit-st-teacher" class="w-full p-2 border rounded-xl"></select></div>
                    <div><label class="block font-semibold mb-1">Qrup ID</label><select id="edit-st-group" class="w-full p-2 border rounded-xl"></select></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block font-semibold mb-1">Qiymət (AZN)</label><input type="number" id="edit-st-price" class="w-full p-2 border rounded-xl"></div>
                    <div><label class="block font-semibold mb-1">Status</label><select id="edit-st-status" class="w-full p-2 border rounded-xl"><option value="paid">Ödənilib</option><option value="debt">Borc var</option></select></div>
                </div>
                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" class="btn-close-modal px-4 py-2 bg-slate-100 rounded-xl font-semibold">Ləğv et</button>
                    <button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded-xl font-semibold">Yadda Saxla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Добавить Пользователя / Студента -->
    <div id="modal-add-user" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-in">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-base"><i class="fa-solid fa-user-plus text-orange-500 mr-2"></i>Yeni Əlavə Et</h3>
                <button class="btn-close-modal text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-add-user" class="space-y-3 text-xs">
                <div><label class="block font-semibold mb-1">Rol</label>
                    <select id="add-role" class="w-full p-2 border rounded-xl"><option value="student">Tələbə</option><option value="teacher">Müəllim</option></select>
                </div>
                <div><label class="block font-semibold mb-1">Ad və Soyad</label><input type="text" id="add-name" required class="w-full p-2 border rounded-xl"></div>
                
                <!-- Поля для учителя -->
                <div id="fields-teacher" class="hidden space-y-3">
                    <div><label class="block font-semibold mb-1">Login</label><input type="text" id="add-login" class="w-full p-2 border rounded-xl"></div>
                    <div><label class="block font-semibold mb-1">Şifrə</label><input type="text" id="add-pass" class="w-full p-2 border rounded-xl"></div>
                    <div><label class="block font-semibold mb-1">Fənn</label><input type="text" id="add-subject" class="w-full p-2 border rounded-xl"></div>
                </div>

                <!-- Поля для студента -->
                <div id="fields-student" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block font-semibold mb-1">Tədris Tipi</label><select id="add-st-type" class="w-full p-2 border rounded-xl"><option value="individual">Fərdi</option><option value="unassigned">Bölüşdürülməyib</option></select></div>
                        <div><label class="block font-semibold mb-1">Müəllim</label><select id="add-st-teacher" class="w-full p-2 border rounded-xl"></select></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block font-semibold mb-1">Paket</label><select id="add-st-pkg" class="w-full p-2 border rounded-xl"><option value="8">8 dərs</option><option value="12">12 dərs</option></select></div>
                        <div><label class="block font-semibold mb-1">Qiymət (AZN)</label><input type="number" id="add-st-price" class="w-full p-2 border rounded-xl" value="0"></div>
                    </div>
                </div>
                
                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" class="btn-close-modal px-4 py-2 bg-slate-100 rounded-xl font-semibold">Ləğv et</button>
                    <button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded-xl font-semibold">Əlavə Et</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Добавить Группу -->
    <div id="modal-add-group" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-in">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-base"><i class="fa-solid fa-users text-orange-500 mr-2"></i>Yeni Qrup Əlavə Et</h3>
                <button class="btn-close-modal text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-add-group" class="space-y-3 text-xs">
                <div><label class="block font-semibold mb-1">Qrup Adı</label><input type="text" id="add-grp-name" required class="w-full p-2 border rounded-xl" placeholder="Məs: İngilis dili B1"></div>
                <div><label class="block font-semibold mb-1">Müəllim</label><select id="add-grp-teacher" required class="w-full p-2 border rounded-xl"></select></div>
                <div><label class="block font-semibold mb-1">Paket Norması</label><select id="add-grp-pkg" class="w-full p-2 border rounded-xl"><option value="8">8 dərs</option><option value="12">12 dərs</option></select></div>
                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" class="btn-close-modal px-4 py-2 bg-slate-100 rounded-xl font-semibold">Ləğv et</button>
                    <button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded-xl font-semibold">Yarat</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyXviqLb-jqJTJKv0ncfEIl3OPpv7TU5U0XS4Blt8jPq9wV4IG9WzTlw4-mSyUKaaZ7/exec";
        
        // ВНИМАНИЕ: LocalStorage удален. Храним данные в памяти для текущей сессии.
        let globalAppState = { users: [], groups: [], students: [], logs: [] };
        let currentUser = null;
        let currentAdminTab = 'payments';
        let currentTeacherTab = 'individual';

        async function postToAppsScript(payload) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (err) {
                return { status: "error", message: err.toString() };
            }
        }

        async function fetchRemoteData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.status === 'success') {
                    globalAppState = data.data; // Применяем напрямую из таблицы
                    return true;
                }
            } catch (err) { console.error('API Fetch Error:', err); }
            return false;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'border-l-orange-500 text-slate-800' : 'border-l-red-500 text-red-700';
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border bg-white border-l-4 ${color} animate-fade-in`;
            toast.innerHTML = `<span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2500);
        }

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginScreen();
                bindLoginEvents();
            } else if (currentUser.role === 'teacher') {
                app.innerHTML = renderTeacherPanel();
                bindTeacherEvents();
            } else if (currentUser.role === 'admin') {
                app.innerHTML = renderAdminPanel();
                bindAdminEvents();
            }
            bindGlobalEvents();
        }

        function renderLoginScreen() {
            return `
            <div class="min-h-screen flex items-center justify-center">
                <form id="login-form" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border space-y-4">
                    <h1 class="text-2xl font-bold text-center text-orange-500">Aslan Lessons</h1>
                    <div><label class="block text-xs font-semibold mb-1">Login</label><input type="text" id="login-username" class="w-full p-2.5 bg-slate-50 border rounded-xl text-sm" required></div>
                    <div><label class="block text-xs font-semibold mb-1">Şifrə</label><input type="password" id="login-password" class="w-full p-2.5 bg-slate-50 border rounded-xl text-sm" required></div>
                    <button type="submit" id="btn-login-submit" class="w-full py-3 bg-orange-500 text-white rounded-xl text-sm font-bold">Daxil ol</button>
                </form>
            </div>`;
        }

        function bindLoginEvents() {
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-login-submit');
                btn.innerText = "Yoxlanılır...";
                
                const res = await postToAppsScript({ action: "LOGIN", username: document.getElementById('login-username').value.trim(), password: document.getElementById('login-password').value.trim() });
                
                if (res.status === 'success') {
                    currentUser = res.user;
                    await fetchRemoteData();
                    render();
                } else {
                    showToast(res.message, 'error');
                    btn.innerText = "Daxil ol";
                }
            });
        }

        // Рендер टीचर-панели
        function renderTeacherPanel() {
            const teacherStudents = globalAppState.students.filter(s => s.type === 'individual' && s.teacher_login === currentUser.login);
            const teacherGroups = globalAppState.groups.filter(g => g.teacher_login === currentUser.login);

            return `
            <header class="bg-white border-b py-3 px-6 flex justify-between items-center sticky top-0 z-30">
                <div class="font-bold text-lg text-slate-800">Aslan Lessons <span class="text-xs text-slate-500 font-normal">Müəllim</span></div>
                <div class="flex gap-3">
                    <button class="btn-sync text-orange-500 text-sm font-bold"><i class="fa-solid fa-rotate mr-1"></i>Yenilə</button>
                    <button class="btn-logout text-slate-500 text-sm font-bold ml-4"><i class="fa-solid fa-right-from-bracket mr-1"></i>Çıxış</button>
                </div>
            </header>
            <main class="p-6 max-w-6xl mx-auto w-full">
                <div class="mb-6 flex gap-2">
                    <button id="tab-indiv" class="px-4 py-2 rounded-xl text-xs font-bold ${currentTeacherTab === 'individual' ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'}">Fərdi (${teacherStudents.length})</button>
                    <button id="tab-groups" class="px-4 py-2 rounded-xl text-xs font-bold ${currentTeacherTab === 'groups' ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'}">Qruplar (${teacherGroups.length})</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${currentTeacherTab === 'individual' ? 
                        teacherStudents.map(s => `
                        <div class="bg-white p-5 rounded-2xl border shadow-sm">
                            <h3 class="font-bold">${s.student_name}</h3>
                            <div class="text-sm my-2">Keçilib: <b>${s.lessons_completed}/${s.package_type}</b></div>
                            <div class="flex gap-2 mt-3">
                                <button data-action="mark-att" data-id="${s.id}" data-status="absent" class="flex-1 bg-red-100 text-red-600 py-1.5 rounded-lg text-xs font-bold">NB</button>
                                <button data-action="mark-att" data-id="${s.id}" data-status="present" class="flex-1 bg-orange-500 text-white py-1.5 rounded-lg text-xs font-bold">Qeyd Et</button>
                            </div>
                        </div>`).join('') :
                        teacherGroups.map(g => {
                            const groupSts = globalAppState.students.filter(s => s.group_id === g.group_id);
                            return `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                                <h3 class="font-bold text-orange-600 mb-3">${g.group_name}</h3>
                                <div class="space-y-2 mb-4">
                                    ${groupSts.map(st => `
                                        <label class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded border">
                                            <span><input type="checkbox" checked class="grp-check-${g.group_id} mr-2" value="${st.id}"> ${st.student_name}</span>
                                            <span class="text-slate-400">${st.lessons_completed}/${st.package_type}</span>
                                        </label>
                                    `).join('')}
                                </div>
                                <button data-action="mark-grp" data-id="${g.group_id}" class="w-full bg-orange-500 text-white py-2 rounded-lg text-xs font-bold">Dərsi Tamamla</button>
                            </div>`
                        }).join('')
                    }
                </div>
            </main>`;
        }

        function bindTeacherEvents() {
            document.getElementById('tab-indiv')?.addEventListener('click', () => { currentTeacherTab = 'individual'; render(); });
            document.getElementById('tab-groups')?.addEventListener('click', () => { currentTeacherTab = 'groups'; render(); });

            document.querySelectorAll('[data-action="mark-att"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const status = btn.getAttribute('data-status');
                    btn.innerText = "...";
                    await postToAppsScript({
                        action: "MARK_LESSON", actor: currentUser.login,
                        students: [{ id: btn.getAttribute('data-id'), status: status, reason: status === 'absent' ? 'NB' : '' }]
                    });
                    await fetchRemoteData(); render();
                });
            });

            document.querySelectorAll('[data-action="mark-grp"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const gId = btn.getAttribute('data-id');
                    const checkboxes = document.querySelectorAll(`.grp-check-${gId}`);
                    const studentsData = Array.from(checkboxes).map(c => ({ id: c.value, status: c.checked ? 'present' : 'absent', reason: c.checked ? '' : 'NB' }));
                    
                    btn.innerText = "Yüklənir...";
                    await postToAppsScript({ action: "MARK_LESSON", actor: currentUser.login, students: studentsData, details: `Группа ${gId} отметила урок` });
                    await fetchRemoteData(); render();
                });
            });
        }

        // Рендер Админ-панели
        function renderAdminPanel() {
            return `
            <header class="bg-white border-b py-3 px-6 flex justify-between items-center sticky top-0 z-30">
                <div class="font-bold text-lg text-slate-800">Aslan Lessons <span class="text-xs text-orange-600 font-bold">Admin</span></div>
                <div class="hidden md:flex gap-2">
                    ${['payments', 'groups', 'users', 'logs'].map(tab => 
                        `<button id="tab-adm-${tab}" class="px-3 py-1.5 rounded-lg text-xs font-bold ${currentAdminTab === tab ? 'bg-orange-100 text-orange-600' : 'text-slate-600'}">${tab.toUpperCase()}</button>`
                    ).join('')}
                </div>
                <div class="flex gap-3">
                    <button class="btn-sync text-orange-500 text-sm font-bold"><i class="fa-solid fa-rotate mr-1"></i>Yenilə</button>
                    <button class="btn-logout text-slate-500 text-sm font-bold ml-4"><i class="fa-solid fa-right-from-bracket mr-1"></i>Çıxış</button>
                </div>
            </header>
            <main class="p-6 max-w-6xl mx-auto w-full">
                ${currentAdminTab === 'payments' ? renderAdminPayments() : ''}
                ${currentAdminTab === 'groups' ? renderAdminGroups() : ''}
                ${currentAdminTab === 'users' ? renderAdminUsers() : ''}
                ${currentAdminTab === 'logs' ? renderAdminLogs() : ''}
            </main>`;
        }

        function renderAdminPayments() {
            const individualSts = globalAppState.students.filter(s => s.type === 'individual');
            return `
            <h2 class="text-xl font-bold mb-4">Fərdi Tələbələr - Paket Yeniləmə</h2>
            <div class="bg-white rounded-2xl border overflow-hidden">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-3">Ad</th><th class="p-3">Müəllim</th><th class="p-3">Status</th><th class="p-3 text-right">Aksiya</th></tr></thead>
                    <tbody class="divide-y">
                        ${individualSts.map(s => `
                        <tr>
                            <td class="p-3 font-bold cursor-pointer text-orange-600" data-action="view-st" data-id="${s.id}">${s.student_name}</td>
                            <td class="p-3">${s.teacher_login}</td>
                            <td class="p-3">${s.lessons_completed}/${s.package_type} (${s.package_price} AZN)</td>
                            <td class="p-3 text-right"><button data-action="renew" data-id="${s.id}" class="bg-orange-50 text-orange-600 px-3 py-1 rounded font-bold">Yeni Paket</button></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        function renderAdminGroups() {
            return `
            <div class="flex justify-between mb-4"><h2 class="text-xl font-bold">Qruplar</h2><button id="btn-open-group" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+ Yeni Qrup</button></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${globalAppState.groups.map(g => `
                <div class="bg-white p-5 rounded-2xl border">
                    <div class="flex justify-between font-bold text-orange-600 mb-2"><span>${g.group_name}</span><button data-action="del-grp" data-id="${g.group_id}" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>
                    <div class="text-xs text-slate-500 mb-2">Müəllim: ${g.teacher_login} | Paket: ${g.package_type}</div>
                    <button data-action="renew-grp" data-id="${g.group_id}" class="w-full bg-slate-100 text-slate-700 py-1.5 rounded-lg text-xs font-bold mt-2">Qrup Paketi Yenilə (0-la)</button>
                </div>`).join('')}
            </div>`;
        }

        function renderAdminUsers() {
            const list = [...globalAppState.users.map(u => ({ id: u.login, name: u.name, role: u.role, isUser: true })), ...globalAppState.students.map(s => ({ id: s.id, name: s.student_name, role: 'student', isUser: false }))];
            return `
            <div class="flex justify-between mb-4"><h2 class="text-xl font-bold">İstifadəçilər</h2><button id="btn-open-user" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+ Yeni Əlavə Et</button></div>
            <div class="bg-white rounded-2xl border overflow-hidden">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-3">Ad</th><th class="p-3">Rol</th><th class="p-3 text-right">Aksiya</th></tr></thead>
                    <tbody class="divide-y">
                        ${list.map(item => `
                        <tr>
                            <td class="p-3 font-bold">${item.name}</td>
                            <td class="p-3">${item.role}</td>
                            <td class="p-3 text-right">
                                ${!item.isUser ? `<button data-action="edit-st" data-id="${item.id}" class="text-slate-500 mr-3"><i class="fa-solid fa-pen"></i></button>` : ''}
                                ${item.role !== 'admin' ? `<button data-action="del-user" data-id="${item.id}" data-type="${item.isUser ? 'teacher' : 'student'}" class="text-red-500"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        function renderAdminLogs() {
            return `
            <h2 class="text-xl font-bold mb-4">Tarixçə (Son 50)</h2>
            <div class="bg-white rounded-2xl border p-4 space-y-2 text-xs">
                ${globalAppState.logs.map(l => `<div class="border-b pb-2"><span class="text-slate-400 font-mono">${l.timestamp}</span> | <b>${l.actor}</b> | ${l.details}</div>`).join('')}
            </div>`;
        }

        function bindAdminEvents() {
            ['payments', 'groups', 'users', 'logs'].forEach(tab => {
                document.getElementById(`tab-adm-${tab}`)?.addEventListener('click', () => { currentAdminTab = tab; render(); });
            });

            // Открыть модалки
            document.getElementById('btn-open-group')?.addEventListener('click', () => {
                document.getElementById('add-grp-teacher').innerHTML = globalAppState.users.filter(u=>u.role==='teacher').map(t=>`<option value="${t.login}">${t.name}</option>`).join('');
                document.getElementById('modal-add-group').classList.remove('hidden');
            });

            document.getElementById('btn-open-user')?.addEventListener('click', () => {
                document.getElementById('add-st-teacher').innerHTML = globalAppState.users.filter(u=>u.role==='teacher').map(t=>`<option value="${t.login}">${t.name}</option>`).join('');
                document.getElementById('modal-add-user').classList.remove('hidden');
            });

            // Смена роли в модалке юзера
            document.getElementById('add-role')?.addEventListener('change', (e) => {
                document.getElementById('fields-teacher').classList.toggle('hidden', e.target.value !== 'teacher');
                document.getElementById('fields-student').classList.toggle('hidden', e.target.value !== 'student');
            });

            // Сохранить новую группу
            document.getElementById('form-add-group')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                await postToAppsScript({
                    action: "CREATE_GROUP", actor: currentUser.login,
                    group_id: "grp_" + Date.now(), group_name: document.getElementById('add-grp-name').value,
                    teacher_login: document.getElementById('add-grp-teacher').value, package_type: document.getElementById('add-grp-pkg').value
                });
                document.getElementById('modal-add-group').classList.add('hidden');
                await fetchRemoteData(); render();
            });

            // Сохранить нового пользователя/студента
            document.getElementById('form-add-user')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const role = document.getElementById('add-role').value;
                if(role === 'teacher') {
                    await postToAppsScript({ action: "ADD_TEACHER", actor: currentUser.login, teacher_data: { login: document.getElementById('add-login').value, password: document.getElementById('add-pass').value, name: document.getElementById('add-name').value, subject: document.getElementById('add-subject').value } });
                } else {
                    await postToAppsScript({ action: "ADD_STUDENT", actor: currentUser.login, student_data: { id: "st_" + Date.now(), student_name: document.getElementById('add-name').value, type: document.getElementById('add-st-type').value, teacher_login: document.getElementById('add-st-teacher').value, package_type: document.getElementById('add-st-pkg').value, package_price: document.getElementById('add-st-price').value, payment_status: "paid", added_date: new Date().toISOString().split('T')[0] } });
                }
                document.getElementById('modal-add-user').classList.add('hidden');
                await fetchRemoteData(); render();
            });

            // Удаления
            document.querySelectorAll('[data-action="del-grp"]').forEach(b => b.addEventListener('click', async () => {
                if(confirm('Qrupu silmək?')) { await postToAppsScript({action: "DELETE_GROUP", actor: currentUser.login, group_id: b.getAttribute('data-id')}); await fetchRemoteData(); render(); }
            }));
            document.querySelectorAll('[data-action="del-user"]').forEach(b => b.addEventListener('click', async () => {
                if(confirm('Silmək?')) {
                    const action = b.getAttribute('data-type') === 'teacher' ? 'DELETE_TEACHER' : 'DELETE_STUDENT';
                    const idField = b.getAttribute('data-type') === 'teacher' ? 'login' : 'id';
                    await postToAppsScript({action: action, actor: currentUser.login, [idField]: b.getAttribute('data-id')});
                    await fetchRemoteData(); render();
                }
            }));

            // Обновление пакета (Renew)
            document.querySelectorAll('[data-action="renew"]').forEach(b => b.addEventListener('click', async () => {
                await postToAppsScript({ action: "UPDATE_PACKAGE", actor: currentUser.login, student_ids: [b.getAttribute('data-id')], price: prompt("Yeni ödəniş məbləği (AZN):", "0"), details: "Fərdi paket yeniləndi" });
                await fetchRemoteData(); render();
            }));
            
            document.querySelectorAll('[data-action="renew-grp"]').forEach(b => b.addEventListener('click', async () => {
                const gId = b.getAttribute('data-id');
                const stIds = globalAppState.students.filter(s => s.group_id === gId).map(s => s.id);
                if (stIds.length > 0) {
                    await postToAppsScript({ action: "UPDATE_PACKAGE", actor: currentUser.login, student_ids: stIds, price: prompt("Qrup üçün hər tələbənin ödənişi (AZN):", "0"), details: "Qrup paketi yeniləndi" });
                    await fetchRemoteData(); render();
                }
            }));
            
            // Редактирование студента
            document.querySelectorAll('[data-action="edit-st"]').forEach(b => b.addEventListener('click', () => {
                const st = globalAppState.students.find(s => s.id === b.getAttribute('data-id'));
                if(st) {
                    document.getElementById('edit-st-id').value = st.id;
                    document.getElementById('edit-st-name').value = st.student_name;
                    document.getElementById('edit-st-type').value = st.type;
                    document.getElementById('edit-st-pkg').value = st.package_type;
                    document.getElementById('edit-st-price').value = st.package_price;
                    document.getElementById('edit-st-status').value = st.payment_status;
                    
                    document.getElementById('edit-st-teacher').innerHTML = `<option value="">-</option>` + globalAppState.users.filter(u=>u.role==='teacher').map(t=>`<option value="${t.login}" ${st.teacher_login===t.login?'selected':''}>${t.name}</option>`).join('');
                    document.getElementById('edit-st-group').innerHTML = `<option value="">-</option>` + globalAppState.groups.map(g=>`<option value="${g.group_id}" ${st.group_id===g.group_id?'selected':''}>${g.group_name}</option>`).join('');
                    document.getElementById('modal-edit-student').classList.remove('hidden');
                }
            }));
            
            document.getElementById('form-edit-student')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                await postToAppsScript({ action: "EDIT_STUDENT", actor: currentUser.login, student_data: { id: document.getElementById('edit-st-id').value, student_name: document.getElementById('edit-st-name').value, type: document.getElementById('edit-st-type').value, teacher_login: document.getElementById('edit-st-teacher').value, group_id: document.getElementById('edit-st-group').value, package_type: document.getElementById('edit-st-pkg').value, package_price: document.getElementById('edit-st-price').value, payment_status: document.getElementById('edit-st-status').value } });
                document.getElementById('modal-edit-student').classList.add('hidden');
                await fetchRemoteData(); render();
            });
        }

        function bindGlobalEvents() {
            // Кнопка "Обновить" просто скачивает заново и перерисовывает экран (ничего не удаляя)
            document.querySelectorAll('.btn-sync').forEach(btn => {
                btn.addEventListener('click', async () => {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>...';
                    await fetchRemoteData();
                    render();
                });
            });

            document.querySelectorAll('.btn-logout').forEach(btn => {
                btn.addEventListener('click', () => { currentUser = null; render(); });
            });

            document.querySelectorAll('.btn-close-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
                });
            });
            
            // Просмотр истории (History Modal)
            document.querySelectorAll('[data-action="view-st"]').forEach(b => b.addEventListener('click', () => {
                const st = globalAppState.students.find(s => s.id === b.getAttribute('data-id'));
                if(st) {
                    document.getElementById('hist-student-name').innerText = st.student_name;
                    document.getElementById('hist-student-sub').innerText = `Paket: ${st.package_type} | Keçilib: ${st.lessons_completed}`;
                    
                    const hList = typeof st.history === 'string' ? JSON.parse(st.history) : st.history;
                    document.getElementById('hist-attendance-list').innerHTML = hList && hList.length ? hList.map(h => `<div class="flex justify-between border-b py-1"><span>${h.date}</span> <span class="${h.status==='present'?'text-green-600':'text-red-500'} font-bold">${h.status==='present'?'İştirak':'NB'}</span></div>`).join('') : '<p class="text-slate-400">Boş</p>';
                    
                    const cList = typeof st.payment_cycles === 'string' ? JSON.parse(st.payment_cycles) : st.payment_cycles;
                    document.getElementById('hist-cycles-list').innerHTML = cList && cList.length ? cList.map(c => `<div class="flex justify-between border-b py-1"><span>${c.date}</span> <b>${c.price} AZN</b></div>`).join('') : '<p class="text-slate-400">Boş</p>';
                    
                    document.getElementById('modal-student-history').classList.remove('hidden');
                }
            }));
        }
        
        // Авторизация при загрузке
        window.addEventListener('DOMContentLoaded', async () => {
            render(); 
        });
    </script>
</body>
</html>
