          <li><b>Qrup:</b> Qrupun adı | 8 və ya 12 — sonrakı sətirlər bu qrupun tələbələridir (ən azı 2 nəfər). Dərs sayı yazılmasa, 8 götürülür.</li>
          <li><b>Fərdi:</b> 8 və ya 12 — sonrakı hər tələbə üçün ayrıca fərdi məşğələ yaradılır.</li>
          <li><b>Tələbə sətri:</b> Ad Soyad | Valideyn — yalnız ad məcburidir. Telefon nömrələri yazılsa belə saxlanılmır.</li></ul>
        ${smp(IMP_SAMPLE)}
        <p style="margin-top:10px">Məşğələsi olmayan tələbələri ayrıca əlavə etmək üçün:</p>
        ${smp('Tələbələr:\nFidan Rəhimova\nMurad Abbasov')}
        <p style="margin-top:10px" class="hint"># ilə başlayan sətirlər nəzərə alınmır — özünüz üçün qeyd yaza bilərsiniz. Sətrin əvvəlindəki «1.», «2)» və «-» işarələri avtomatik silinir.</p></div>
      <div class="ex-help-sec"><h4><span class="n">3</span>Login və şifrə</h4>
        <ul><li><b>Login avtomatik yaradılır:</b> müəllimin adı + fənn. Məsələn: Rəna + Riyaziyyat → <span class="ex-kbd">renamath</span>, Ruslan + Kimya → <span class="ex-kbd">ruslanchem</span>, Orxan + Tarix → <span class="ex-kbd">orxanhist</span>.</li>
          <li>Eyni login təkrarlanarsa, sonuna rəqəm əlavə olunur: <span class="ex-kbd">renamath2</span>.</li>
          <li>Öz loginini vermək istəsəniz, müəllim sətrinin sonuna yazın: <span class="ex-kbd">| login: rena.math</span></li>
          <li><b>İlkin şifrə hamı üçün eynidir</b> (yuxarıdakı sahə, adətən 12345). «İlk girişdə şifrəni dəyişsinlər» seçilibsə, müəllim ilk dəfə daxil olanda öz şifrəsini təyin etməyincə sayt açılmır. Bu, yalnız bir dəfə soruşulur.</li></ul>
        <p style="margin-top:8px" class="hint">Fənn kodları: Riyaziyyat — math, Kimya — chem, Tarix — hist, Fizika — phys, Biologiya — bio, İngilis dili — eng, Rus dili — rus, Azərbaycan dili — az, Ədəbiyyat — lit, Coğrafiya — geo, İnformatika — inf. Başqa fənlərdə adın ilk 4 hərfi götürülür.</p></div>
      <div class="ex-help-sec"><h4><span class="n">4</span>Təkrarlar və təhlükəsizlik</h4>
        <ul><li><b>Eyni tələbə bir neçə məşğələdə</b> ola bilər — adı eyni yazılıbsa, bir tələbə kimi yaradılır.</li>
          <li><b>Eyni adlı iki fərqli tələbə</b> varsa, birinin adına fərqləndirici işarə əlavə edin: «Əli Məmmədov 2». Eyni ad həmişə eyni tələbə sayılır.</li>
          <li><b>Eyni siyahını iki dəfə idxal etmək təhlükəsizdir:</b> artıq olanlar təkrar yaradılmır. Sonradan yeni tələbə və ya qrup əlavə edib yenidən idxal edə bilərsiniz.</li>
          <li>Mövcud məlumat dəyişdirilmir və silinmir. Yeganə dəyişiklik: mövcud qrupa siyahıdakı yeni tələbə əlavə olunur.</li>
          <li>Bütün əməliyyatlar jurnala yazılır.</li></ul></div>
    </div>`,
    foot: `<button class="btn btn-soft" data-smp>${ic('sparkle')}Nümunəni əlavə et</button><button class="btn btn-primary" data-close>Aydındır</button>`,
    onMount: (el, close) => { el.querySelector('[data-smp]').addEventListener('click', () => { close(); ACT.impSample(); }); } });
};

function initLoader(el){
  if (el.dataset.run) return; el.dataset.run = '1';
  if (el.querySelector('[data-logo]')) hydrateIcons(el);
  const msg = el.querySelector('.loader-msg');
  const pipsEl = el.querySelector('.pips');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let filled = 0;
  const timers = [];
  if (!reduce) timers.push(setInterval(() => {
    if (!el.isConnected) return stop();
    const dots = pipsEl ? pipsEl.querySelectorAll('.pip') : [];
    filled = (filled + 1) % (dots.length + 1);
    dots.forEach((d, i) => d.classList.toggle('on', i < filled));
  }, 280));
  const student = studentCtx();
  timers.push(setTimeout(() => {
    if (!el.isConnected) return stop();
    if (student){
      msg.className = 'loader-msg tip quote';
      msg.innerHTML = wordHtml(pickWord());
      return;
    }
    const showTip = () => {
      if (!el.isConnected || msg.classList.contains('warn')) return;
      msg.className = 'loader-msg tip';
      msg.innerHTML = `<p>${esc(pickTip())}</p>`;
    };
    showTip();
    timers.push(setInterval(showTip, 3000));
  }, student ? 900 : 3000));
  timers.push(setTimeout(() => {
    if (!el.isConnected) return stop();
    const warn = document.createElement('div');
    warn.className = 'loader-msg warn';
    warn.innerHTML = `<p>${esc(slowText())}</p>`;
    if (student) msg.after(warn); else { msg.className = 'loader-msg warn'; msg.innerHTML = warn.innerHTML; }
    const mode = el.dataset.retry;
    if (mode === 'none') return;
    const r = document.createElement('button');
    r.className = 'btn btn-soft btn-sm retry';
    r.innerHTML = mode === 'cancel' ? ic('x') + 'Ləğv et' : ic('refresh') + 'Yenidən yoxla';
    r.addEventListener('click', () => {
      if (mode === 'reload') location.reload();
      else if (mode === 'cancel') cancelLoginWait();
      else { stop(); if (S.d && !$('#shell').hidden) renderPage(false); }
    });
    el.appendChild(r);
  }, 6500));
  function stop(){ timers.forEach(t => { clearTimeout(t); clearInterval(t); }); }
  el._stop = stop;
  const chk = setInterval(() => { if (!el.isConnected){ stop(); clearInterval(chk); } }, 1000);
}
function slowWatch(start){
  if (start){
    slowCount++;

        if (document.querySelector('.loader[data-staged]') && document.querySelector('.loader[data-staged]').offsetParent) return;
        const bar = $('#slowBar');
        bar.innerHTML = `<span class="spin"></span><span>${esc(slowText())}</span>`;
        bar.hidden = false;
      }, 6000);
    }
  } else {
    slowCount = Math.max(0, slowCount - 1);
    if (!slowCount){ clearTimeout(slowTimer); const bar = $('#slowBar'); bar.hidden = true; bar.innerHTML = ''; }
  }
}

  $$('[data-count]', root || document).forEach(el => {

    const to = Number(el.dataset.count); if (!isFinite(to) || to <= 0 || to > 1e6) return;
    const t0 = performance.now(), dur = Math.min(1100, 450 + to * 2);
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(to * e).toLocaleString('az-Latn-AZ');
      if (k < 1) requestAnimationFrame(step);
    };
    el.textContent = '0';
    requestAnimationFrame(step);
  });
}

async function loadAudit(id){
  const box = $('#auditBox'); if (!box) return;
  box.innerHTML = loadingBox();
  try {
    await swr('gameAudit', { studentId: id }, (r) => {
      if (S.ui.auditId !== id || !$('#auditBox')) return;
      $('#auditBox').innerHTML = auditHtml(r.audit); hydrateIcons($('#auditBox'));
    });
  } catch (e) { if (e.code !== 'AUTH' && $('#auditBox')) $('#auditBox').innerHTML = emptyBox('Açılmadı', esc(e.message)); }
}

ACT.badgeOp = (b) => {
  const op = b.dataset.op, sid = b.dataset.s, bid = b.dataset.b;
  const cat = (S.ui.board && S.ui.board.catalog || []).find(x => x.id === bid) || { name: bid };
  openModal({ title: op === 'add' ? 'Nişan ver' : 'Nişanı geri al', sub: esc(cat.name), size: 'sm',
    body: `<form class="stack" id="bgForm" novalidate><div class="bd-big">${badgeSvg(bid, op === 'remove')}</div>
      <label class="field"><span>Səbəb</span><input class="input" name="note" maxlength="160" placeholder="${op === 'add' ? 'məsələn: kağız imtahanda 100%' : 'məsələn: dərs səhv qeyd olunmuşdu'}"></label>
      <p class="hint">${op === 'add' ? 'Tələbə bildiriş alacaq. Qeyd jurnala yazılır.' : 'Geri alınan nişanı sistem avtomatik yenidən vermir — lazım olsa, əl ilə qaytara bilərsiniz.'}</p></form>`,
    foot: `<button class="btn btn-ghost" data-close>Ləğv et</button><button class="btn btn-primary" form="bgForm" type="submit">${op === 'add' ? ic('plus') + 'Ver' : ic('trash') + 'Geri al'}</button>`,

          try { await api('gameBadge', { studentId: sid, badge: bid, op, note: inp.value.trim() }, { noRender: true }); close(); toast(op === 'add' ? 'Nişan verildi.' : 'Nişan geri alındı.', 'ok'); loadAudit(sid); }
          catch (ex) { if (ex.code !== 'AUTH') fieldErr(f, ex.message); }
        });
      });
    } });
};

const ERR_SENT = new Set();
let errCount = 0;
function reportError(msg, where, stack){
  if (!API_URL || /BURAYA/.test(API_URL)) return;
  msg = String(msg || '').slice(0, 500);
  if (!msg || /ResizeObserver loop|^Script error\.?$/i.test(msg)) return;
  const k = msg + '|' + where;
  if (ERR_SENT.has(k) || errCount >= 8) return;
  ERR_SENT.add(k); errCount++;
  try {
    fetch(API_URL, { method: 'POST', redirect: 'follow', cache: 'no-store', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'clientError', token: S.token || '', msg, where: String(where || '') + ' · ' + (location.hash || '#'),
        stack: String(stack || '').slice(0, 1500), ua: navigator.userAgent.slice(0, 160), ver: APP_VER }) }).catch(() => {});
  } catch (e) {}
}
window.addEventListener('error', e => {
  if (e.target && e.target !== window) return;
  reportError(e.message, (String(e.filename || '').split('/').pop() || 'səhifə') + ':' + e.lineno + ':' + e.colno, e.error && e.error.stack);
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  if (r instanceof ApiError) return;
  reportError(r && r.message ? r.message : String(r), 'promise', r && r.stack);
});

function bindSel(root, kind, listFn){
  const key = kind === 's' ? 'selS' : 'selU';
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-sel]')){ const s = selSet(key); t.checked ? s.add(t.dataset.sel) : s.delete(t.dataset.sel); t.closest('tr').classList.toggle('sel-on', t.checked); syncAll(root, key); drawBulk(kind); }
    else if (t.matches('[data-selall]')){
      const s = selSet(key);
      $$('[data-sel]', root).forEach(c => { c.checked = t.checked; t.checked ? s.add(c.dataset.sel) : s.delete(c.dataset.sel); c.closest('tr').classList.toggle('sel-on', t.checked); });
      syncAll(root, key); drawBulk(kind);
    }
  });
}
function syncAll(root, key){
  if (!root) return;
  const boxes = $$('[data-sel]', root);
  const on = boxes.length > 0 && boxes.every(c => c.checked), some = boxes.some(c => c.checked);
  $$('[data-selall]', root).forEach(all => { all.checked = on; all.indeterminate = !on && some; });
}

ACT.bulkClear = (b) => {

};

    const fall = () => { const b = atob(c.toDataURL('image/jpeg', .9).split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); res(u); };

  obj(3, () => push(`<</Title ${str(title)}/Author ${str('Aslan Lessons')}/Creator ${str('Aslan Lessons')}>>`));
  pages.forEach((p, i) => {
    const P = 4 + 3 * i, I = P + 1, C = P + 2, cs = `q ${p.w} 0 0 ${p.h} 0 0 cm /Im${i} Do Q`;
    obj(P, () => push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${p.w} ${p.h}]/Resources<</XObject<</Im${i} ${I} 0 R>>>>/Contents ${C} 0 R>>`));

function letterOf(r){
  const first = String(r.student.name || '').trim().split(/\s+/)[0] || 'Övladınız';
  const g = r.game, total = r.held + r.absent;
  const P = [];
  if (!total) P.push(`Bu ay ${first} üçün dərs qeydi olmayıb. Onu yenidən dərslərdə görməyə şad olacağıq — hər yeni ay yeni imkanlar deməkdir.`);
  else if (r.rate >= 90) P.push(`${first} bu ay ${r.held} dərsdə iştirak edib${r.absent ? ` və cəmi ${r.absent} dərs buraxıb` : ' və heç bir dərsi buraxmayıb'}. Bu, məsuliyyətin və öyrənməyə olan marağın ən gözəl göstəricisidir.`);
  else if (r.rate >= 70) P.push(`${first} bu ay ${r.held} dərsdə iştirak edib, ${r.absent} dərsi buraxıb. Davamiyyəti yaxşıdır — bir az da diqqətlə növbəti ay bütün dərslərə gəlmək tamamilə mümkündür.`);
  else P.push(`${first} bu ay ${r.held} dərsdə iştirak edib, ${r.absent} dərsi isə buraxıb. Mövzular bir-birinin davamı olduğu üçün dərsləri buraxmamaq çox vacibdir — gəlin növbəti ay birlikdə buna xüsusi diqqət edək.`);
  const A = [];
  if (g){
    if (g.grow) A.push(`Xüsusilə sevindirici xəbər: bu ay ${first} «Ayın ən çox irəliləyəni» seçildi — ötən aya görə ən böyük inkişafı məhz o göstərdi.`);
    else if (g.prevScore > 0 && g.score > g.prevScore) A.push(`Ötən ayla müqayisədə reytinq balı ${g.score - g.prevScore} bal artıb (${g.prevScore} → ${g.score}).`);
    if (g.place && g.place <= 10) A.push(g.live ? `Hazırda aylıq reytinqdə ${azOrd(g.place)} yerdədir.` : `Aylıq reytinqdə ${azOrd(g.place)} yeri tutub.`);
    const b = g.badges || [];
    if (b.length === 1) A.push(`Bu ay «${b[0].name}» nişanını qazanıb.`);
    else if (b.length > 1) A.push(`Bu ay ${b.length} yeni nişan qazanıb: ${b.slice(0, 4).map(x => '«' + x.name + '»').join(', ')}${b.length > 4 ? ' və digərləri' : ''}.`);
    if ((g.bonuses || []).length) A.push(`Müəllimdən ${g.bonuses.length} dəfə xüsusi tərif (bonus) alıb.`);
  }
  const ex = (r.exams || []).filter(x => x.status !== 'review' && typeof x.pct === 'number');
  if (ex.length){
    const avg = Math.round(ex.reduce((s, x) => s + x.pct, 0) / ex.length);
    A.push(`İmtahanlarda orta nəticəsi ${avg}% olub${avg >= 85 ? ' — əla göstəricidir!' : '.'}`);
  }
  if (!A.length && total) A.push(`Hər dərs, hər səy növbəti uğurun təməlidir — ${first} bu yolda addım-addım irəliləyir.`);
  if (A.length) P.push(A.join(' '));
  const good = total && (r.rate >= 80 || (g && (g.grow || (g.place && g.place <= 3))));
  P.push(good
    ? 'Evdə onun uğurlarını qeyd etməyiniz və təriflərinizi əsirgəməməyiniz motivasiyasını daha da artıracaq. Birlikdə daha böyük nəticələr əldə edəcəyimizə inanıram!'

  if (PC.ny) P.push('Qarşıdan gələn Yeni iliniz mübarək! Ailənizə can sağlığı, sevinc və bərəkət, övladınıza isə yeni ildə yeni zirvələr və böyük uğurlar arzulayırıq.');

}

function pdfPreview(cvs){ return cvs.map((c, i) => `<img src="${c.toDataURL('image/jpeg', .85)}" alt="Səhifə ${i + 1}" loading="lazy">`).join(''); }
function openReport(load, title){
  run(null, async () => {
    let r = (await load('')).report;
    let pages = await reportPages(r);
    openModal({ title: title || 'Aylıq hesabat', sub: esc(r.student.name), size: 'wide',
      body: `<div class="rp-bar"><label class="field" style="margin:0"><span>Ay</span><select class="select" id="rpMonth">${r.months.map(m => `<option value="${m}" ${m === r.month ? 'selected' : ''}>${fmtMonthKey(m)}</option>`).join('')}</select></label>
        <p class="hint">Fayl «${esc(fileName(r.student.name))}.pdf» adı ilə yüklənəcək.</p></div>
        <div class="pdf-prev" id="rpBox">${pdfPreview(pages)}</div>`,
      foot: `<button class="btn btn-ghost" data-close>Bağla</button><button class="btn btn-primary" data-rpdl>${ic('download')}PDF yüklə</button>`,
      onMount: (el) => {
        const sel = el.querySelector('#rpMonth'), box = el.querySelector('#rpBox');
        sel.addEventListener('change', () => run(null, async () => {
          box.classList.add('busy');
          r = (await load(sel.value)).report;
          pages = await reportPages(r);
          box.innerHTML = pdfPreview(pages); box.classList.remove('busy');
        }));
        el.querySelector('[data-rpdl]').addEventListener('click', (e) => run(e.currentTarget, async () => {
          const blob = await pdfBlob(pages.map(c => ({ canvas: c, w: 595, h: 842 })), `${r.student.name} — ${capFirst(r.label)}`);
          saveBlob(blob, fileName(r.student.name) + '.pdf');
          toast('PDF yükləndi.');
        }));
      } });
  });
}
ACT.certificate = (b) => run(b, async () => {

function certWords(c){
  const first = String(c.name || '').trim().split(/\s+/)[0] || 'Məzunumuz';
  const m = Number(c.months) || 0;
  const s1 = m >= 12 ? `${m} ay ərzində ${first} bilik yolunu bizimlə birlikdə addım-addım keçdi və bu yolu ləyaqətlə başa vurdu.`
    : m >= 4 ? `${m} ay ərzində ${first} böyük səy göstərdi və hər dərsdə bir az da irəlilədi.`
    : `Qısa müddətdə ${first} öyrənməyə olan həvəsi və zəhməti ilə hamımızın diqqətini çəkdi.`;
  const s2 = c.rate == null ? 'Məsuliyyəti və çalışqanlığı ilə müəllimlərinin rəğbətini qazandı.'
    : c.rate >= 90 ? 'Nümunəvi davamiyyəti, məsuliyyəti və diqqəti ilə müəllimlərinin rəğbətini qazandı.'
    : c.rate >= 75 ? 'Məsuliyyəti və çalışqanlığı ilə dərslərdə hər zaman fəal oldu.'
    : 'Çətinliklərə baxmayaraq öyrənməkdən vaz keçmədi və kursu sona qədər bitirdi — bu, güclü iradənin göstəricisidir.';
  const s3 = c.badges >= 5 ? `Qazandığı ${c.badges} nişan onun zəhmətinin bəhrəsidir.` : '';
  const s4 = 'Ona gələcək təhsilində və həyatında yeni uğurlar, parlaq nailiyyətlər arzu edirik!';
  return [s1, s2, s3, s4].filter(Boolean);
}

function socRaw(k){ try { const v = S.site && S.site.social && S.site.social[k]; return String(v || (SOCIAL && SOCIAL[k]) || '').trim(); } catch (e) { return ''; } }
function socUrl(k){
  let v = socRaw(k);
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (k === 'whatsapp'){ const d = v.replace(/\D/g, ''); return d.length >= 7 ? 'https://wa.me/' + d : ''; }
  v = v.replace(/^@/, '');
  if (!/^[\w.]+$/.test(v)) return '';
  return k === 'instagram' ? 'https://www.instagram.com/' + v : 'https://www.tiktok.com/@' + v;
}
function socHandle(k){
  const u = socUrl(k); if (!u) return '';
  const m = u.match(/(?:instagram\.com|tiktok\.com)\/@?([\w.]+)/i);

}

}

function shareModal(it, blob, url){

        ${navigator.share ? `<button type="button" class="btn btn-soft btn-block" data-shr="link">${ic('link')}Linki paylaş</button>` : ''}
        <a class="btn btn-soft btn-block" href="${esc(waLink(text + '\n' + url))}" target="_blank" rel="noopener">${ic('wa')}WhatsApp-da göndər</a>

      </div>
      <p class="shr-note">${tb('shield-lock')}<span>Linkdə yalnız qısa adın və nişanların görünür. Ballar, dərslər və digər məlumatlar paylaşılmır.</span></p></div>`,
    foot: `<button class="btn btn-soft" data-close>Bağla</button>`,
    onMount: (el) => {
      el.addEventListener('click', async (e) => {
        const t = e.target.closest('[data-shr]'); if (!t) return;
        const k = t.dataset.shr;
        if (k === 'file'){ try { await navigator.share({ files: [file], text: text + '\n' + url }); } catch (er) { if (er && er.name !== 'AbortError') { saveBlob(blob, fname); toast('Şəkil yükləndi — onu istədiyin yerdə paylaş.', 'ok'); } } }
        else if (k === 'link'){ try { await navigator.share({ title: 'Aslan Lessons', text, url }); } catch (er) {} }
        else if (k === 'save'){ saveBlob(blob, fname); toast('Şəkil yükləndi.', 'ok'); }

}

  await pdfFonts();
  const W = 1080, H = 1920, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const F = (w, s) => `${w} ${s}px Poppins, "Segoe UI", Arial, sans-serif`;
  const text = (t, x, y, font, color, align) => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, x, y); };
  const spaced = (t, x, y, font, color, sp) => {
    ctx.font = font;
    const ch = [...t], w = ch.reduce((s, c) => s + ctx.measureText(c).width, 0) + sp * (ch.length - 1);
    let cx = x - w / 2;
    ch.forEach(c => { text(c, cx, y, font, color, 'left'); cx += ctx.measureText(c).width + sp; });
    return w;
  };
  const bg = ctx.createLinearGradient(0, 0, W * .6, H);
  bg.addColorStop(0, '#FFB45F'); bg.addColorStop(.42, '#FF8A1C'); bg.addColorStop(.78, '#F26A00'); bg.addColorStop(1, '#D95200');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 820, 0, W / 2, 820, 760);
  glow.addColorStop(0, 'rgba(255,240,215,.55)'); glow.addColorStop(1, 'rgba(255,240,215,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pat = ['book', 'pencil', 'star', 'bulb', 'atom', 'compass', 'school', 'calculator', 'award', 'trophy', 'rocket', 'notebook', 'ruler', 'flask', 'medal', 'sparkles'];
  ctx.save(); ctx.globalAlpha = .1;
  for (let r = 0; r < 12; r++) for (let c = 0; c < 6; c++){
    const x = c * 180 + 40 + rnd() * 70 + (r % 2 ? 40 : 0), y = r * 165 + 20 + rnd() * 60, s = 50 + rnd() * 26;
    if (Math.hypot(x - W / 2, y - 830) < 330) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate((rnd() - .5) * .7);
    svgPaint(ctx, tbSvg(pat[(r * 6 + c) % pat.length]), -s / 2, -s / 2, s, '#fff'); ctx.restore();
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = .07; svgPaint(ctx, LOGO_SVG('#fff'), W - 520, H - 700, 760, '#fff'); ctx.restore();

  svgPaint(ctx, LOGO_SVG('#fff'), W / 2 - 56, 196, 112, '#fff');
  spaced('ASLAN', W / 2, 372, F(800, 46), '#fff', 12);
  spaced('LESSONS', W / 2, 414, F(500, 24), 'rgba(255,255,255,.9)', 14);

  const isLv = it.kind === 'level';
  const title = isLv ? it.name : it.b.name;
  ctx.font = F(800, 86);
  let ts = 86;
  let lines = wrapLines(ctx, title, 900);
  while ((lines.length > 2 || lines.some(l => ctx.measureText(l).width > 940)) && ts > 54){ ts -= 4; ctx.font = F(800, ts); lines = wrapLines(ctx, title, 900); }
  lines = lines.slice(0, 2);
  const lh = ts * 1.12;
  const blockH = 70 + 54 + 380 + 70 + lines.length * lh + 30 + 60 + 70 + 56 + 50;
  let y = 470 + Math.max(0, (1440 - 470 - blockH) / 2);

  const eb = isLv ? 'YENİ SƏVİYYƏ' : 'YENİ NİŞAN';
  ctx.font = F(800, 28);
  const ebw = [...eb].reduce((s, c) => s + ctx.measureText(c).width, 0) + 6 * (eb.length - 1) + 72;
  ctx.save(); ctx.shadowColor = 'rgba(120,40,0,.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  rrFill(ctx, W / 2 - ebw / 2, y, ebw, 70, 35, '#fff'); ctx.restore();
  spaced(eb, W / 2, y + 46, F(800, 28), '#E86A00', 6);
  y += 70 + 54;

  const cx = W / 2, cy = y + 190;
  ctx.save(); ctx.translate(cx, cy);
  for (let k = 0; k < 18; k++){
    ctx.rotate(Math.PI * 2 / 18);
    const rg = ctx.createLinearGradient(0, 0, 0, -420); rg.addColorStop(0, 'rgba(255,255,255,.22)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-34, -420); ctx.lineTo(34, -420); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 300);
  halo.addColorStop(0, 'rgba(255,255,255,.75)'); halo.addColorStop(.55, 'rgba(255,255,255,.25)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, 300, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.setLineDash([4, 14]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, 238, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  [[cx - 250, cy - 150, 26], [cx + 236, cy - 120, 20], [cx + 260, cy + 140, 28], [cx - 230, cy + 170, 18], [cx + 40, cy - 268, 16]].forEach(([x, yy, s]) => svgPaint(ctx, tbSvg('sparkles'), x - s / 2, yy - s / 2, s, '#fff'));
  ctx.save(); ctx.shadowColor = 'rgba(110,35,0,.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 22;
  svgPaint(ctx, isLv ? levelBadge(it.i) : badgeSvg(it.b.id), cx - 190, cy - 190, 380, '#FF7A00');
  ctx.restore();
  y += 380 + 70;

  ctx.save(); ctx.shadowColor = 'rgba(110,35,0,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  lines.forEach((ln, i) => text(ln, W / 2, y + ts * .82 + i * lh, F(800, ts), '#fff'));
  ctx.restore();
  y += lines.length * lh + 30;

  const chip = isLv ? `${it.i + 1}-ci səviyyə` : RAR[it.b.tier] || 'Adi';
  ctx.font = F(700, 28);
  const cw = ctx.measureText(chip).width + (isLv ? 60 : 92);
  rrFill(ctx, W / 2 - cw / 2, y, cw, 60, 30, 'rgba(255,255,255,.2)', 'rgba(255,255,255,.65)', 2);
  if (!isLv){ ctx.fillStyle = ['', '#FFFFFF', '#E2E8F0', '#C4B5FD', '#FDE68A'][it.b.tier] || '#fff'; ctx.beginPath(); ctx.arc(W / 2 - cw / 2 + 36, y + 30, 9, 0, Math.PI * 2); ctx.fill(); }
  text(chip, W / 2 + (isLv ? 0 : 16), y + 40, F(700, 28), '#fff');
  y += 60 + 70;

  text('«Mən bunu qazandım!»', W / 2, y + 10, F(700, 52), '#fff');
  if (who){
    const avI = await avImgOf(S.cab && S.cab.me && S.cab.me.id);
    y += avI ? 88 : 62;
    ctx.font = F(500, 36);
    const ww = ctx.measureText(who).width, aw = avI ? 76 : 0, gp = avI ? 22 : 0, tw = ww + aw + gp, x0 = W / 2 - tw / 2;
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x0 - 70, y - 12, 44, 3); ctx.fillRect(x0 + tw + 26, y - 12, 44, 3);
    if (avI) avDraw(ctx, avI, x0, y - 12 - aw / 2, aw, '#fff');
    text(who, x0 + aw + gp, y, F(500, 36), 'rgba(255,255,255,.95)', 'left');
  }

  const by = 1470, bh = 220;
  ctx.save(); ctx.shadowColor = 'rgba(110,35,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  rrFill(ctx, 90, by, W - 180, bh, 48, 'rgba(255,255,255,.95)'); ctx.restore();
  svgPaint(ctx, tbSvg('rocket'), 140, by + 62, 96, '#FF7A00');
  ctx.font = F(800, 42);
  const cl = wrapLines(ctx, 'Sən də özünü göstərməyə hazırsan?', 640).slice(0, 2);
  const ty = by + (cl.length > 1 ? 82 : 100);
  cl.forEach((ln, i) => text(ln, 270, ty + i * 50, F(800, 42), '#2B2118', 'left'));
  text('Aslan Lessons-a qoşul!', 270, ty + cl.length * 50 + 6, F(600, 30), '#D25E00', 'left');

  const ig = socHandle('instagram') || socHandle('tiktok');
  if (ig){
    ctx.font = F(600, 34);
    const iw = ctx.measureText(ig).width + 62;
    svgPaint(ctx, tbSvg(socHandle('instagram') ? 'brand-instagram' : 'brand-tiktok'), W / 2 - iw / 2, 1760, 44, '#fff');
    text(ig, W / 2 - iw / 2 + 62, 1794, F(600, 34), '#fff', 'left');
  }
  return cv;
}

function noIndex(){
  if (document.querySelector('meta[name="robots"]')) return;
  const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex, nofollow'; document.head.appendChild(m);
}
async function renderPublicShare(arg){
  noIndex();
  pubLoading();
  const parts = String(arg || '').split('/');
  const t = parts[0], f = parts.slice(1).join('/');
  try {
    const r = await api('shareView', { t, f }, { noRender: true, silent: true });
    const x = r.share, fc = x.focus;
    const art = fc ? (fc.kind === 'level' ? levelBadge(fc.i) : badgeSvg(fc.id)) : levelBadge(x.level.i);
    const head = fc ? (fc.kind === 'level' ? `«${esc(fc.name)}» səviyyəsinə çatdı!` : `«${esc(fc.name)}» nişanını qazandı!`) : 'Nailiyyətlər';
    const list = x.badges.slice().sort((a, b) => (fc && a.id === fc.id ? -1 : fc && b.id === fc.id ? 1 : b.tier - a.tier));
    const ask = `Salam! ${x.name} adlı tələbənizin nailiyyətini gördüm. Kurslarınız haqqında məlumat almaq istəyirəm.`;
    const wa = waTo(ask);
    document.title = `${x.name} — Aslan Lessons`;
    pubPaint(pubShell(`
      <div class="pub-hero shr-hero"><div class="brand-rings"></div>
        <div class="shr-art">${art}</div>
        <div class="shr-ht"><div class="eyebrow">${fc ? (fc.kind === 'level' ? 'Yeni səviyyə' : 'Yeni nişan') : 'Tələbə nailiyyətləri'}</div>
        <h1><span>${esc(x.name)}</span>${head}</h1>
        ${fc && fc.kind === 'badge' ? `<p class="sub">${esc(fc.desc)}</p><span class="rar r${fc.tier}">${RAR[fc.tier]}</span>` : ''}</div></div>
      <div class="pub-card shr-mot"><span class="shr-mot-ic">${tb('rocket')}</span><div><h3>Kiçik addımlar — böyük nəticələr</h3>
        <p>${esc(x.name)} qısa müddətdə özünü inkişaf etdirdi və bu nailiyyətləri qazandı. Hər dərs, hər imtahan və hər səy onu bir addım irəli apardı.</p></div></div>
      <div class="pub-card"><div class="section-head"><h3>Bütün nailiyyətləri</h3><span class="count">${x.badges.length} / ${x.total}</span></div>
        <div class="shr-lv">${levelBadge(x.level.i)}<div><small>Səviyyə</small><b>${esc(x.level.name)}</b></div></div>
        ${list.length ? `<div class="bd-grid sm shr-grid">${list.map(b => badgeCard(b, { short: true, plain: true })).join('')}</div>` : '<p class="hint">Nişanlar tezliklə burada olacaq.</p>'}</div>
      <div class="shr-cta"><div class="shr-cta-bg">${LOGO_SVG('#fff')}</div>
        <span class="shr-cta-eb">${tb('sparkles')}Növbəti uğur hekayəsi səninki ola bilər</span>
        <h2>Sən də özünü göstərməyə hazırsan?</h2>
        <p>Aslan Lessons-da hər dərs yeni bilik, hər uğur yeni nişandır. Bizə qoşul və ${esc(x.name)} kimi öz nailiyyətlərini qazan!</p>
        <div class="shr-cta-btns">
          ${wa ? `<a class="btn btn-lg shr-wa" href="${esc(wa)}" target="_blank" rel="noopener" data-hit="1">${tb('brand-whatsapp')}Bizə yaz</a>` : `<button type="button" class="btn btn-lg shr-wa" data-hit="1">${tb('brand-whatsapp')}Bizə yaz</button>`}
          ${socLink('instagram', 'Instagram', 'btn btn-lg shr-ig', `${tb('brand-instagram')}Instagram-da izlə`, ' data-hit="1"')}
        </div></div>`));
    let hit = false;
    $$('#public [data-hit]').forEach(a => a.addEventListener('click', () => {
      if (hit) return; hit = true;
      api('shareHit', { t, kind: 'click', ua: (navigator.userAgent || '').slice(0, 40) }, { noRender: true, silent: true }).catch(() => {});
    }));
  } catch (e) { pubFail(e, e.message, 'Səhifəni açmaq alınmadı. Bir az sonra yenidən yoxlayın.'); }
}

  const total = blocks.reduce((s, b) => s + b[1], 0);
  const top = story ? 230 : 110, bottom = H - ground - (story ? 60 : 30);
  let y = top + Math.max(0, (bottom - top - total) / 2);
  const center = (t, yy, font, fill) => { ctx.font = font; ctx.fillStyle = fill; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, W / 2, yy); };
  const spaced = (t, yy, font, color, sp) => { ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; const ch = [...t], w = ch.reduce((s, c) => s + ctx.measureText(c).width, 0) + sp * (ch.length - 1); let cx = W / 2 - w / 2; ctx.fillStyle = color; ch.forEach(c => { ctx.fillText(c, cx, yy); cx += ctx.measureText(c).width + sp; }); };
  const shadow = (fn) => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6; fn(); ctx.restore(); };
  blocks.forEach(([k, h]) => {
    if (k === 'lion') seasonLion(ctx, W / 2 - Z.lion / 2, y, Z.lion, nv ? 'nv' : 'ny');
    else if (k === 'brand') spaced('ASLAN LESSONS', y + h * .8, F(700, Z.brand), 'rgba(255,255,255,.85)', 10);
    else if (k === 't1') shadow(() => nv ? center('Novruz', y + h * .8, F(800, Z.t1), nyGold(ctx, 0, y, 0, y + h)) : center(story ? 'Yeni iliniz' : 'Yeni iliniz mübarək!', y + h * .8, F(800, Z.t1), '#fff'));
    else if (k === 't2' && h) shadow(() => nv ? center('bayramınız mübarək!', y + h * .8, F(700, Z.t2), '#fff') : center('mübarək!', y + h * .8, F(800, Z.t2), nyGold(ctx, 0, y, 0, y + h)));
    else if (k === 'yr' && h){
      if (nv){ nvSemeni(ctx, W / 2, y + h * .82, h * 1.05); }
      else {
        const by = y + h; ctx.save(); ctx.font = F(800, Z.yr); ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(252,211,77,.55)'; ctx.shadowBlur = 40;
        ctx.fillStyle = nyGold(ctx, 0, y, 0, by); ctx.fillText(yr, W / 2, by); ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.strokeText(yr, W / 2, by); ctx.restore();
      }
    }
    else if (k === 'hi') center('Əziz', y + h * .8, F(500, Z.hi), 'rgba(255,255,255,.85)');
    else if (k === 'name') nl.forEach((ln, i) => center(ln, y + ns * .85 + i * ns * 1.15, F(700, ns), nyGold(ctx, 0, y + i * ns * 1.15, 0, y + (i + 1) * ns * 1.15)));
    else if (k === 'wish') wl.forEach((ln, i) => center(ln, y + ws * 1.1 + i * ws * 1.5, F(400, ws), 'rgba(255,255,255,.94)'));
    else if (k === 'rule'){ ctx.fillStyle = 'rgba(252,211,77,.75)'; ctx.fillRect(W / 2 - 50, y, 100, 3); }
    else if (k === 'from') center(o.from, y + h * .8, F(600, Z.from), '#FDE68A');
    y += h;
  });
  return cv;
}

const SLK = { on: false, y: 0 };
function scrollLockSync(){
  const want = !!document.querySelector('#modalRoot .mback:not(.closing)');

    h.classList.add('scroll-lock');

  } else {

function confettiBurst(k){
  let rm = false;
  try { rm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  const cols = k === 'bd' ? ['#F472B6', '#FDE68A', '#FFFFFF', '#A78BFA', '#60A5FA', '#C026D3'] : k === 'ny' ? ['#FCD34D', '#60A5FA', '#FFFFFF', '#F43F5E', '#22C55E', '#A78BFA'] : k === 'nv' ? ['#22C55E', '#86EFAC', '#FFFFFF', '#16A34A', '#FCD34D', '#BBF7D0'] : ['#FF7A00', '#FCD34D', '#22C55E', '#3B82F6', '#EC4899', '#A78BFA'];
  const c = document.createElement('canvas'); c.className = 'cfx'; c.setAttribute('aria-hidden', 'true'); document.body.appendChild(c);
  const d = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * d; c.height = H * d;
  const x = c.getContext('2d'); x.scale(d, d);
  const n = rm ? 40 : W < 700 ? 120 : 190;
  const P = Array.from({ length: n }, (_, i) => { const left = i % 2 === 0; return { x: left ? -10 : W + 10, y: H * (.55 + Math.random() * .3), vx: (left ? 1 : -1) * (4 + Math.random() * 8), vy: -(9 + Math.random() * 9), r: 4 + Math.random() * 5, c: cols[i % cols.length], a: Math.random() * 6.28, va: (Math.random() - .5) * .3, sh: i % 3 }; });
  const t0 = performance.now();
  const step = (t) => {
    const e = t - t0;
    x.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.globalAlpha = Math.max(0, 1 - e / 4200); x.fillStyle = p.c;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a);
      if (p.sh === 0) x.fillRect(-p.r, -p.r * .4, p.r * 2, p.r * .8); else if (p.sh === 1){ x.beginPath(); x.arc(0, 0, p.r * .6, 0, 6.283); x.fill(); } else { x.beginPath(); x.moveTo(0, -p.r); x.lineTo(p.r * .8, p.r * .6); x.lineTo(-p.r * .8, p.r * .6); x.closePath(); x.fill(); }
      x.restore();
    });
    if (e < 4300) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

async function bdStory(name){
  await pdfFonts();
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const F = (w, s) => `${w} ${s}px Poppins, "Segoe UI", Arial, sans-serif`;
  const bg = ctx.createLinearGradient(0, 0, W * .4, H);
  bg.addColorStop(0, '#2E1065'); bg.addColorStop(.5, '#6D28D9'); bg.addColorStop(1, '#DB2777');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = (x, y, r, c) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
  glow(W / 2, 980, 620, 'rgba(253,230,138,.30)'); glow(120, 300, 380, 'rgba(244,114,182,.35)'); glow(W - 80, 1500, 420, 'rgba(96,165,250,.25)');
  const rnd = rndSeed('bd' + name), cc = ['#FDE68A', '#F472B6', '#FFFFFF', '#A5F3FC', '#FCD34D', '#C4B5FD'];
  for (let i = 0; i < 170; i++){
    const x = rnd() * W, y = rnd() * H, s = 6 + rnd() * 12; ctx.save(); ctx.translate(x, y); ctx.rotate(rnd() * 6.28); ctx.globalAlpha = .45 + rnd() * .5; ctx.fillStyle = cc[i % cc.length];
    if (i % 3) ctx.fillRect(-s / 2, -s / 4, s, s / 2); else { ctx.beginPath(); ctx.arc(0, 0, s / 2.6, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  const flags = ['#F472B6', '#FDE68A', '#60A5FA', '#A78BFA', '#34D399'];
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, 40); ctx.quadraticCurveTo(W / 2, 170, W + 20, 40); ctx.stroke();
  for (let i = 0; i < 12; i++){
    const t = (i + .5) / 12, x = -20 + t * (W + 40), y = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 170 + t * t * 40;
    ctx.fillStyle = flags[i % flags.length]; ctx.beginPath(); ctx.moveTo(x - 34, y); ctx.lineTo(x + 34, y); ctx.lineTo(x, y + 70); ctx.closePath(); ctx.fill();
  }
  const balloon = (x, y, r, c, sway) => {
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, y + r * 1.25); ctx.bezierCurveTo(x + sway, y + r * 2, x - sway, y + r * 2.8, x + sway * .5, y + r * 3.6); ctx.stroke();
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.22, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 10, y + r * 1.2 + 10); ctx.lineTo(x + 10, y + r * 1.2 + 10); ctx.lineTo(x, y + r * 1.2 - 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .45, r * .2, r * .34, -.4, 0, 6.283); ctx.fill();
  };
  balloon(130, 640, 78, '#F472B6', 30); balloon(250, 520, 66, '#FDE68A', -24); balloon(90, 420, 56, '#A78BFA', 20);
  balloon(W - 130, 620, 80, '#60A5FA', -30); balloon(W - 255, 500, 64, '#F472B6', 24); balloon(W - 95, 400, 54, '#FDE68A', -20);
  const ls = 150, lx = W / 2 - ls / 2, ly = 250;
  rrFill(ctx, lx, ly, ls, ls, 44, '#FFFFFF');
  ctx.save(); ctx.translate(lx + 22, ly + 22); ctx.scale((ls - 44) / 100, (ls - 44) / 100); ctx.fillStyle = '#6D28D9'; ctx.fill(new Path2D(LION_D), 'evenodd'); ctx.restore();
  ctx.font = F(700, 34); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.textAlign = 'center';
  const brand = 'ASLAN LESSONS'; let bw = 0; [...brand].forEach(ch => { bw += ctx.measureText(ch).width + 10; }); let bx = W / 2 - (bw - 10) / 2; ctx.textAlign = 'left';
  [...brand].forEach(ch => { ctx.fillText(ch, bx, ly + ls + 64); bx += ctx.measureText(ch).width + 10; });
  ctx.textAlign = 'center';
  const bdAv = await avImgOf(seasonWho() && seasonWho().id);
  if (bdAv){ ctx.save(); ctx.shadowColor = 'rgba(30,0,60,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; avDraw(ctx, bdAv, W / 2 - 105, 505, 210, '#FDE68A'); ctx.restore(); avDraw(ctx, bdAv, W / 2 - 105, 505, 210, '#FDE68A'); }
  const cx = W / 2, base = 1240;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx, base + 22, 300, 30, 0, 0, 6.283); ctx.fill();
  rrFill(ctx, cx - 300, base, 600, 26, 13, '#FDE68A');
  rrFill(ctx, cx - 250, base - 170, 500, 176, 30, '#C026D3');
  rrFill(ctx, cx - 250, base - 170, 500, 58, 30, '#F9A8D4');
  ctx.fillStyle = '#F9A8D4'; for (let i = 0; i < 6; i++){ const x = cx - 220 + i * 88; ctx.beginPath(); ctx.ellipse(x, base - 112, 26, 34, 0, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = '#FDE68A'; for (let i = 0; i < 9; i++){ ctx.beginPath(); ctx.arc(cx - 210 + i * 52, base - 40, 7, 0, 6.283); ctx.fill(); }
  rrFill(ctx, cx - 170, base - 300, 340, 136, 26, '#F472B6');
  rrFill(ctx, cx - 170, base - 300, 340, 46, 26, '#FFFFFF');
  ctx.fillStyle = '#FFFFFF'; for (let i = 0; i < 4; i++){ const x = cx - 128 + i * 85; ctx.beginPath(); ctx.ellipse(x, base - 256, 22, 28, 0, 0, Math.PI); ctx.fill(); }
  [[-90, '#60A5FA'], [0, '#FDE68A'], [90, '#34D399']].forEach(([dx, c]) => {
    rrFill(ctx, cx + dx - 11, base - 390, 22, 92, 8, c);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4; for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(cx + dx - 11, base - 370 + k * 28); ctx.lineTo(cx + dx + 11, base - 382 + k * 28); ctx.stroke(); }
    glow(cx + dx, base - 418, 60, 'rgba(253,224,71,.55)');
    ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.moveTo(cx + dx, base - 452); ctx.bezierCurveTo(cx + dx + 18, base - 428, cx + dx + 14, base - 400, cx + dx, base - 396); ctx.bezierCurveTo(cx + dx - 14, base - 400, cx + dx - 18, base - 428, cx + dx, base - 452); ctx.fill();
    ctx.fillStyle = '#FEF3C7'; ctx.beginPath(); ctx.ellipse(cx + dx, base - 412, 6, 11, 0, 0, 6.283); ctx.fill();
  });
  const sh = (fn) => { ctx.save(); ctx.shadowColor = 'rgba(30,0,60,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; fn(); ctx.restore(); };
  sh(() => { ctx.font = F(600, 64); ctx.fillStyle = '#FFFFFF'; ctx.fillText('Bu gün mənim', W / 2, 1400); });
  sh(() => { ctx.font = F(800, 112); ctx.fillStyle = '#FDE68A'; ctx.fillText('ad günümdür!', W / 2, 1520); });
  let ns = 70; ctx.font = F(700, ns); while (ctx.measureText(name).width > W - 160 && ns > 40){ ns -= 4; ctx.font = F(700, ns); }
  sh(() => { ctx.font = F(700, ns); ctx.fillStyle = '#FFFFFF'; ctx.fillText(name, W / 2, 1620); });
  rrFill(ctx, 110, 1690, W - 220, 150, 40, 'rgba(255,255,255,.95)');
  ctx.font = F(700, 40); ctx.fillStyle = '#6D28D9'; ctx.fillText('Aslan Lessons ailəsi ilə', W / 2, 1755);
  ctx.font = F(500, 34); ctx.fillStyle = '#9D174D'; ctx.fillText('öyrənirəm və böyüyürəm!', W / 2, 1805);
  return cv;
}
ACT.bdShare = (b) => run(b, async () => {
  const m = bdMe(); if (!m) return;
  const name = shortNm(m.name) || m.name;
  const cv = await bdStory(name);
  const blob = await new Promise(res => { try { cv.toBlob(x => res(x), 'image/png'); } catch (e) { res(null); } });
  if (!blob) throw new Error('Şəkil hazırlamaq alınmadı.');
  const fname = fileName('Aslan Lessons - Ad günü') + '.png';
  let file = null, canFile = false;
  try { file = new File([blob], fname, { type: 'image/png' }); canFile = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
  const url = URL.createObjectURL(blob);
  const save = () => { const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); toast('Şəkil yükləndi — indi story-yə əlavə edə bilərsən.', 'ok'); };
  openModal({ title: 'Ad günü story-si', sub: 'Şəkli Instagram story-yə əlavə et', size: 'sm shr-m',
    body: `<div class="shr"><div class="shr-prev"><img src="${url}" alt="Ad günü story şəkli"></div><div class="shr-acts">
      ${canFile ? `<button type="button" class="btn btn-primary btn-block" data-bds="file">${ic('share')}Şəkli paylaş</button>` : ''}
      <button type="button" class="btn ${canFile ? 'btn-soft' : 'btn-primary'} btn-block" data-bds="save">${ic('download')}Şəkli yüklə</button></div></div>`,
    foot: `<button class="btn btn-ghost btn-block" data-close>Bağla</button>`,
    onClose: () => setTimeout(() => URL.revokeObjectURL(url), 2000),
    onMount: (el) => el.addEventListener('click', async (e) => {
      const x = e.target.closest('[data-bds]'); if (!x) return;
      if (x.dataset.bds === 'save') return save();
      try { await navigator.share({ files: [file], title: 'Ad günüm', text: 'Bu gün mənim ad günümdür!' }); } catch (er) { if (er && er.name !== 'AbortError') save(); }
    }) });
});

async function drawBdayTab(){
  const box = toolBox(); if (!box) return;
  if (!S.ui.bdMon) S.ui.bdMon = String((S.d && S.d.today) || today()).slice(5, 7);
  await swr('bdayList', { month: S.ui.bdMon }, (r) => bdListMount(r));

function bdListMount(r){
  const box = toolBox(); if (!box || S.ui.tab !== 'bday') return;
  const y = Number(String(r.today).slice(0, 4)), mo = Number(r.month);
  const wd = (md) => { const dt = new Date(y, mo - 1, +md.slice(3)); return WEEKDAYS ? WEEKDAYS[dt.getDay()] : ''; };
  const groups = [];
  r.items.forEach(x => { const g = groups[groups.length - 1]; if (g && g.md === x.md) g.list.push(x); else groups.push({ md: x.md, list: [x] }); });
  box.innerHTML = `<div class="bdl-head">
      <div class="bdl-mon"><button class="ibtn" data-bdm="-1" aria-label="Əvvəlki ay">${ic('back')}</button><b>${AZ_MONTHS[mo - 1][0].toUpperCase() + AZ_MONTHS[mo - 1].slice(1)}</b><button class="ibtn bdl-next" data-bdm="1" aria-label="Növbəti ay">${ic('back')}</button></div>
      <div class="bdl-kpi"><b>${r.items.length}</b><small>bu ay ad günü</small></div>
      <div class="bdl-kpi"><b>${r.setCount} / ${r.total}</b><small>ad gününü qeyd edib</small></div></div>
    <p class="hint" style="margin:12px 0 14px">${ic('info')} Siyahıda yalnız ad gününü özü qeyd edən tələbə və müəllimlər görünür — heç kim məcbur deyil. Tarixlər yalnız sizə görünür.</p>
    ${groups.length ? `<div class="bdl-list">${groups.map(g => `<section class="bdl-day${g.list.some(x => x.today) ? ' today' : ''}"><div class="bdl-date"><b>${+g.md.slice(3)}</b><span>${AZ_MONTHS[mo - 1]}</span><small>${esc(wd(g.md))}</small>${g.list.some(x => x.today) ? '<i>Bu gün</i>' : ''}</div>
      <div class="bdl-ppl">${g.list.map(x => `<div class="bdl-p">${avHtml(x.id, x.name, '', { noMedal: true })}<div><b>${x.kind === 's' && can('students.view') ? `<button class="linkish" data-go="student" data-param="${x.id}">${bdN(x.id, x.name)}</button>` : bdN(x.id, x.name)}</b>
        <small>${x.kind === 's' ? `Tələbə${x.courses.length ? ' · ' + esc(x.courses.join(' · ')) : ''}` : `${roleLabel(x.role)}${x.subject ? ' · ' + esc(x.subject) : ''}`}</small></div></div>`).join('')}</div></section>`).join('')}</div>`
    : emptyBox('Bu ay ad günü yoxdur', 'Ad gününü qeyd edənlərdən heç birinin ad günü bu aya düşmür.')}`;
  hydrateIcons(box);
  $$('[data-bdm]', box).forEach(b => b.addEventListener('click', () => {
    let m = Number(S.ui.bdMon) + Number(b.dataset.bdm); if (m < 1) m = 12; if (m > 12) m = 1;
    S.ui.bdMon = String(m).padStart(2, '0'); drawBdayTab();
  }));
}

async function resumeSession(st, tabOnly){
  S.token = st.tok; S.kind = st.kind || 'u'; S.remember = !tabOnly;
  if (st.d){
    try { applyData(st.d, { noRender: true }); S.lastSync = 0; enterApp(); } catch (e) { S.d = null; S.cab = null; }
  }
  if (!S.d) showSplash();
  try {
    const r = await api(S.kind === 's' ? 'sBoot' : 'bootstrap', st.d && st.d.rev ? { since: st.d.rev } : {}, { noRender: !!S.d, silent: !!S.d });
    if (r.same){ S.lastSync = Date.now(); return; }
    if (!st.d || !($('#shell').hidden && $('#cab').hidden)){
      if (!st.d){ await hideSplash(0); enterApp(); }
      else if (S.kind === 's') cabRender(true); else renderPage(true);
    }
  } catch (e) {
    hideSplash(0);
    if (e.code === 'AUTH' || e.code === 'MAINT' || e.code === 'PWD') return;
    if (!S.d){ showLogin(e.message); }
  }
}
